<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - FreelanceHub</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        body {
            background: #f4f7fb;
            color: #222;
            min-height: 100vh;
        }


        /* ================= NAVBAR ================= */

        nav {
            background: #1e3a8a;

            padding: 18px 50px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        nav h2 {
            color: white;
        }


        nav a {
            color: white;

            text-decoration: none;

            margin-left: 25px;

            font-size: 14px;
        }


        nav a:hover {
            color: #bfdbfe;
        }


        /* ================= LOGIN CONTAINER ================= */

        .login-container {

            max-width: 450px;

            margin: 70px auto;

            padding: 35px;

            background: white;

            border-radius: 15px;

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.08);

        }


        .login-container h1 {

            text-align: center;

            color: #1e3a8a;

            margin-bottom: 10px;

        }


        .login-container > p {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }


        /* ================= FORM ================= */

        label {

            display: block;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 6px;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 14px;

        }


        input:focus {

            outline: none;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.1);

        }


        /* ================= BUTTON ================= */

        button {

            width: 100%;

            padding: 13px;

            margin-top: 25px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 7px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;

        }


        button:hover {

            background: #1d4ed8;

        }


        /* ================= MESSAGE ================= */

        .message {

            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;

        }


        .message.error {

            background: #fee2e2;

            color: #b91c1c;

        }


        .message.success {

            background: #dcfce7;

            color: #166534;

        }


        /* ================= LINKS ================= */

        .links {

            text-align: center;

            margin-top: 25px;

        }


        .links p {

            margin: 10px 0;

            color: #666;

        }


        .links a {

            color: #2563eb;

            text-decoration: none;

            font-weight: bold;

        }


        .links a:hover {

            text-decoration: underline;

        }


        /* ================= FOOTER ================= */

        footer {

            background: #1e3a8a;

            color: white;

            text-align: center;

            padding: 20px;

            margin-top: 100px;

        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            nav {

                padding: 15px 20px;

            }


            nav div {

                display: none;

            }


            .login-container {

                margin: 40px 20px;

            }

        }

    </style>

</head>


<body>


<!-- ================= NAVIGATION ================= -->

<nav>

    <h2>
        FreelanceHub
    </h2>


    <div>

        <a href="index.html">
            Home
        </a>


        <a href="register.html">
            Register
        </a>


        <a href="login.html">
            Login
        </a>

    </div>

</nav>



<!-- ================= LOGIN ================= -->

<div class="login-container">


    <h1>
        Welcome Back
    </h1>


    <p>
        Login to your FreelanceHub account
    </p>



    <form
        onsubmit="loginUser(event)">


        <!-- EMAIL -->

        <label for="loginEmail">
            Email Address
        </label>


        <input
            type="email"
            id="loginEmail"
            placeholder="Enter your registered email"
            autocomplete="email"
            required>



        <!-- PASSWORD -->

        <label for="loginPassword">
            Password
        </label>


        <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>



        <!-- LOGIN BUTTON -->

        <button
            type="submit">

            Login

        </button>


    </form>



    <!-- MESSAGE -->

    <div
        id="message"
        class="message">

    </div>



    <!-- LINKS -->

    <div class="links">


        <p>

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>


        <p>

            <a
                href="#"
                onclick="forgotPassword(event)">

                Forgot Password?

            </a>

        </p>


    </div>


</div>



<!-- ================= FOOTER ================= -->

<footer>

    <p>

        © 2026 Freelance Project Collaboration Platform

    </p>

</footer>



<script>


/* =====================================================
   LOGIN FUNCTION
===================================================== */

function loginUser(event) {

    event.preventDefault();


    /* =========================
       GET INPUT VALUES
    ========================= */

    const email =
        document
            .getElementById("loginEmail")
            .value
            .trim()
            .toLowerCase();


    const password =
        document
            .getElementById("loginPassword")
            .value;


    const message =
        document.getElementById(
            "message"
        );


    /* =========================
       GET REGISTERED USERS
    ========================= */

    const users =
        JSON.parse(
            localStorage.getItem(
                "users"
            )
        ) || [];


    /* =========================
       CHECK USERS ARRAY
    ========================= */

    if (!Array.isArray(users)) {

        showMessage(
            "No registered users found. Please register first.",
            "error"
        );

        return;

    }


    /* =========================
       FIND MATCHING USER
    ========================= */

    const user =
        users.find(
            function(item) {

                const savedEmail =
                    String(
                        item.email ||
                        ""
                    )
                    .trim()
                    .toLowerCase();


                const savedPassword =
                    String(
                        item.password ||
                        ""
                    );


                return (
                    savedEmail === email &&
                    savedPassword === password
                );

            }
        );


    /* =========================
       INVALID LOGIN
    ========================= */

    if (!user) {

        showMessage(
            "Invalid email or password.",
            "error"
        );

        return;

    }


    /* =========================
       GET ROLE
    ========================= */

    const role =
        String(
            user.role ||
            ""
        )
        .trim()
        .toLowerCase();


    /* =========================
       CHECK ROLE
    ========================= */

    if (
        role !== "client" &&
        role !== "freelancer"
    ) {

        showMessage(
            "Your account role is missing or invalid. Please register again.",
            "error"
        );

        return;

    }


    /* =========================
       CREATE CURRENT USER
    ========================= */

    const currentUser = {

        id:
            user.id ||
            Date.now(),

        name:
            user.name ||
            "User",

        email:
            user.email,

        password:
            user.password,

        role:
            role,

        skills:
            user.skills ||
            "",

        phone:
            user.phone ||
            "",

        bio:
            user.bio ||
            "",

        createdAt:
            user.createdAt ||
            ""

    };


    /* =========================
       SAVE CURRENT USER
    ========================= */

    localStorage.setItem(
        "currentUser",
        JSON.stringify(
            currentUser
        )
    );


    /* =========================
       SHOW SUCCESS
    ========================= */

    showMessage(
        "Login successful! Redirecting...",
        "success"
    );


    /* =========================
       ROLE-BASED REDIRECT
    ========================= */

    setTimeout(
        function() {


            /* =====================
               CLIENT
            ===================== */

            if (
                role === "client"
            ) {

                window.location.href =
                    "client-dashboard.html";

                return;

            }


            /* =====================
               FREELANCER
            ===================== */

            if (
                role === "freelancer"
            ) {

                window.location.href =
                    "freelancer-dashboard.html";

                return;

            }


        },
        700
    );

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    message.className =
        "message " +
        type;


    message.textContent =
        text;

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

function forgotPassword(event) {

    event.preventDefault();


    alert(
        "Password reset functionality will be available soon."
    );

}

</script>


</body>

</html>
