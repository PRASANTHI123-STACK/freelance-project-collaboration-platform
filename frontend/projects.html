<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Projects - FreelanceHub</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <a href="index.html" class="logo">
        Freelance<span>Hub</span>
    </a>


    <ul class="nav-links">

        <li>
            <a href="client-dashboard.html">
                Dashboard
            </a>
        </li>

        <li>
            <a href="post-project.html">
                Post Project
            </a>
        </li>

        <li>
            <a href="projects.html">
                My Projects
            </a>
        </li>

        <li>
            <a href="profile.html">
                Profile
            </a>
        </li>

    </ul>


    <div class="nav-buttons">

        <a
            href="index.html"
            class="btn-login">

            Logout

        </a>

    </div>

</header>



<!-- ================= PAGE ================= -->

<main class="projects-page">


    <div class="projects-header">

        <div>

            <span class="hero-badge">
                CLIENT WORKSPACE
            </span>

            <h1>
                My Projects
            </h1>

            <p>
                Manage the projects you have posted
                and review freelancer proposals.
            </p>

        </div>


        <a
            href="post-project.html"
            class="primary-btn">

            + Post New Project

        </a>

    </div>



    <!-- ================= PROJECT LIST ================= -->

    <section id="projectList">

        <!-- Projects will appear here -->

    </section>


</main>



<!-- ================= FOOTER ================= -->

<footer class="footer">

    <div class="footer-bottom">

        © 2026 FreelanceHub. All rights reserved.

    </div>

</footer>



<script>


/* ==================================================
   LOAD PROJECTS
   ================================================== */

function loadProjects() {


    const projects =
        JSON.parse(
            localStorage.getItem("projects")
        ) || [];


    const projectList =
        document.getElementById(
            "projectList"
        );


    /* NO PROJECTS */

    if (projects.length === 0) {

        projectList.innerHTML = `

            <div class="empty-projects">

                <div class="empty-icon">
                    📁
                </div>

                <h2>
                    No Projects Yet
                </h2>

                <p>
                    You haven't posted any projects yet.
                </p>

                <a
                    href="post-project.html"
                    class="primary-btn">

                    Post Your First Project

                </a>

            </div>

        `;

        return;

    }


    /* CLEAR OLD PROJECTS */

    projectList.innerHTML = "";


    /* DISPLAY PROJECTS */

    projects.forEach(
        function(project) {


            const card =
                document.createElement("div");


            card.className =
                "project-list-card";


            /* ==========================================
               PROJECT CARD HTML
               ========================================== */

            card.innerHTML = `

                <div class="project-card-main">


                    <div>

                        <span class="project-tag">

                            ${project.category || "Web Development"}

                        </span>


                        <h2>

                            ${project.title || "Untitled Project"}

                        </h2>


                        <p>

                            ${project.description || "No description available."}

                        </p>

                    </div>


                    <span class="project-open">

                        ${project.status || "Open"}

                    </span>


                </div>



                <!-- PROJECT DETAILS -->

                <div class="project-details">


                    <div>

                        <small>
                            Budget
                        </small>

                        <strong>

                            ₹${project.budget || 0}

                        </strong>

                    </div>


                    <div>

                        <small>
                            Deadline
                        </small>

                        <strong>

                            ${project.deadline || "-"}

                        </strong>

                    </div>


                    <div>

                        <small>
                            Project Type
                        </small>

                        <strong>

                            ${project.projectType || "Fixed Price"}

                        </strong>

                    </div>


                    <div>

                        <small>
                            Proposals
                        </small>

                        <strong>

                            ${project.proposals || 0}

                        </strong>

                    </div>


                </div>



                <!-- SKILLS -->

                <div class="project-skills">

                    <strong>
                        Skills:
                    </strong>

                    ${project.skills || "Not specified"}

                </div>



                <!-- ==========================
                     ACTION BUTTONS
                     ========================== -->

                <div class="project-card-actions">


                    <!-- VIEW PROJECT -->

                    <button
                        onclick="viewProject(${project.id})"
                        class="secondary-btn">

                        View Project

                    </button>



                    <!-- VIEW PROPOSALS -->

                    <button
                        onclick="viewProposals(${project.id})"
                        class="primary-btn">

                        View Proposals
                        (${project.proposals || 0})

                    </button>



                    <!-- DELETE PROJECT -->

                    <button
                        onclick="deleteProject(${project.id})"
                        class="delete-btn">

                        Delete

                    </button>


                </div>

            `;


            /* ADD CARD TO PAGE */

            projectList.appendChild(
                card
            );

        }
    );

}



/* ==================================================
   VIEW PROJECT
   ================================================== */

function viewProject(id) {


    localStorage.setItem(
        "selectedProject",
        id
    );


    window.location.href =
        "project-details.html";

}



/* ==================================================
   VIEW PROPOSALS
   ================================================== */

function viewProposals(id) {


    /* Save selected project */

    localStorage.setItem(
        "selectedProject",
        id
    );


    /* Open proposals page */

    window.location.href =
        "proposals.html";

}



/* ==================================================
   DELETE PROJECT
   ================================================== */

function deleteProject(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this project?"
        );


    if (!confirmDelete) {

        return;

    }


    let projects =
        JSON.parse(
            localStorage.getItem("projects")
        ) || [];


    /* Remove selected project */

    projects =
        projects.filter(
            function(project) {

                return project.id !== id;

            }
        );


    /* Save updated projects */

    localStorage.setItem(
        "projects",
        JSON.stringify(projects)
    );


    /* Refresh page */

    loadProjects();

}



/* ==================================================
   START
   ================================================== */

loadProjects();


</script>


</body>

</html>
