<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Proposals - FreelanceHub</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .proposals-page {
            min-height: calc(100vh - 70px);
            background: #f5f7fb;
            padding: 45px 20px 70px;
        }

        .proposals-container {
            max-width: 1100px;
            margin: auto;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 10px 0;
            color: #111827;
            font-size: 34px;
        }

        .page-header p {
            color: #64748b;
            margin: 0;
        }

        .hero-badge {
            display: inline-block;
            padding: 7px 14px;
            background: #eff6ff;
            color: #2563eb;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .proposal-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.06);
        }

        .proposal-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .proposal-top h2 {
            margin: 0 0 8px;
            color: #111827;
            font-size: 22px;
        }

        .proposal-date {
            color: #94a3b8;
            font-size: 13px;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }

        .pending {
            background: #fef3c7;
            color: #92400e;
        }

        .accepted {
            background: #dcfce7;
            color: #15803d;
        }

        .rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .not-selected {
            background: #f1f5f9;
            color: #64748b;
        }

        .proposal-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 25px;
            padding: 20px 0;
            border-top: 1px solid #e5e7eb;
            border-bottom: 1px solid #e5e7eb;
        }

        .detail span {
            display: block;
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .detail strong {
            color: #111827;
            font-size: 17px;
        }

        .cover-letter {
            margin-top: 22px;
        }

        .cover-letter h3 {
            margin: 0 0 8px;
            color: #111827;
            font-size: 16px;
        }

        .cover-letter p {
            margin: 0;
            color: #475569;
            line-height: 1.7;
        }

        .empty-state {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 70px 25px;
            text-align: center;
        }

        .empty-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            margin: 0 0 8px;
            color: #111827;
        }

        .empty-state p {
            margin: 0;
            color: #64748b;
        }

        .browse-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .browse-btn:hover {
            background: #1d4ed8;
        }

        @media (max-width: 700px) {

            .proposal-top {
                flex-direction: column;
            }

            .proposal-details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <a
        href="index.html"
        class="logo">

        Freelance<span>Hub</span>

    </a>


    <ul class="nav-links">

        <li>
            <a href="freelancer-dashboard.html">
                Dashboard
            </a>
        </li>

        <li>
            <a href="browse-projects.html">
                Browse Projects
            </a>
        </li>

        <li>
            <a href="my-proposals.html">
                My Proposals
            </a>
        </li>

        <li>
            <a href="profile.html">
                Profile
            </a>
        </li>

    </ul>


    <div class="nav-buttons">

        <a
            href="index.html"
            class="btn-login">

            Logout

        </a>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="proposals-page">

    <div class="proposals-container">


        <div class="page-header">

            <span class="hero-badge">
                FREELANCER WORKSPACE
            </span>

            <h1>
                My Proposals
            </h1>

            <p>
                Track the proposals you have submitted
                and see their current status.
            </p>

        </div>


        <section id="proposalList">

        </section>


    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-bottom">

        © 2026 FreelanceHub. All rights reserved.

    </div>

</footer>


<script>


/* =====================================================
   LOAD MY PROPOSALS
===================================================== */

function loadMyProposals() {


    const proposals =
        JSON.parse(
            localStorage.getItem(
                "proposals"
            )
        ) || [];


    const currentUser =
        JSON.parse(
            localStorage.getItem(
                "currentUser"
            )
        ) || {};


    const proposalList =
        document.getElementById(
            "proposalList"
        );


    /*
       Get freelancer email.
    */

    const currentEmail =
        currentUser.email ||
        currentUser.emailAddress ||
        "";


    /*
       Get freelancer name.
    */

    const currentName =
        currentUser.name ||
        currentUser.fullName ||
        currentUser.full_name ||
        currentUser.username ||
        "";


    /*
       Filter proposals belonging
       to this freelancer.
    */

    let myProposals =
        proposals.filter(
            function(proposal) {

                /*
                   Prefer email when available.
                */

                if (
                    currentEmail &&
                    proposal.freelancerEmail
                ) {

                    return (
                        proposal.freelancerEmail ===
                        currentEmail
                    );

                }


                /*
                   Otherwise compare name.
                */

                if (
                    currentName &&
                    proposal.freelancerName
                ) {

                    return (
                        proposal.freelancerName ===
                        currentName
                    );

                }


                return false;

            }
        );


    /*
       If currentUser isn't configured yet,
       show all proposals for testing.
    */

    if (
        !currentEmail &&
        !currentName
    ) {

        myProposals =
            proposals;

    }


    /* =========================
       NO PROPOSALS
    ========================= */

    if (
        myProposals.length === 0
    ) {

        proposalList.innerHTML = `

            <div class="empty-state">

                <div class="empty-icon">
                    📩
                </div>

                <h2>
                    No Proposals Yet
                </h2>

                <p>
                    You haven't submitted any
                    project proposals yet.
                </p>

                <a
                    href="browse-projects.html"
                    class="browse-btn">

                    Browse Projects

                </a>

            </div>

        `;

        return;

    }


    /* =========================
       DISPLAY PROPOSALS
    ========================= */

    proposalList.innerHTML = "";


    myProposals.forEach(
        function(proposal) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "proposal-card";


            const status =
                proposal.status ||
                "Pending";


            const statusClass =
                getStatusClass(
                    status
                );


            card.innerHTML = `

                <div class="proposal-top">

                    <div>

                        <h2>

                            ${escapeHTML(
                                proposal.projectTitle ||
                                "Untitled Project"
                            )}

                        </h2>

                        <div class="proposal-date">

                            Submitted:
                            ${escapeHTML(
                                proposal.submittedAt ||
                                "-"
                            )}

                        </div>

                    </div>


                    <span
                        class="status ${statusClass}">

                        ${escapeHTML(status)}

                    </span>

                </div>


                <div class="proposal-details">


                    <div class="detail">

                        <span>
                            Proposed Budget
                        </span>

                        <strong>

                            ₹${Number(
                                proposal.proposedBudget ||
                                0
                            ).toLocaleString("en-IN")}

                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Delivery Time
                        </span>

                        <strong>

                            ${proposal.deliveryTime || 0}
                            days

                        </strong>

                    </div>


                    <div class="detail">

                        <span>
                            Proposal Status
                        </span>

                        <strong>

                            ${escapeHTML(status)}

                        </strong>

                    </div>


                </div>


                <div class="cover-letter">

                    <h3>
                        Your Cover Letter
                    </h3>

                    <p>

                        ${escapeHTML(
                            proposal.coverLetter ||
                            "No cover letter provided."
                        )}

                    </p>

                </div>

            `;


            proposalList.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function getStatusClass(status) {

    if (
        status === "Accepted"
    ) {

        return "accepted";

    }


    if (
        status === "Rejected"
    ) {

        return "rejected";

    }


    if (
        status === "Not Selected"
    ) {

        return "not-selected";

    }


    return "pending";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(value);

    return div.innerHTML;

}


/* =====================================================
   START
===================================================== */

loadMyProposals();

</script>


</body>

</html>
