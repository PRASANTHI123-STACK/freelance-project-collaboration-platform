<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Freelancer Proposals - FreelanceHub</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        /* =========================
           PAGE
        ========================= */

        .proposals-page {
            min-height: calc(100vh - 70px);
            background: #f5f7fb;
            padding: 45px 20px 60px;
        }

        .proposals-container {
            max-width: 1100px;
            margin: auto;
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            color: #111827;
            font-size: 34px;
        }

        .page-header p {
            margin: 0;
            color: #64748b;
        }


        /* =========================
           PROJECT SUMMARY
        ========================= */

        .project-summary {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
        }

        .project-label {
            display: inline-block;
            color: #2563eb;
            background: #eff6ff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .project-summary h2 {
            margin: 14px 0 8px;
            color: #111827;
            font-size: 25px;
        }

        .project-summary p {
            margin: 0;
            color: #64748b;
            line-height: 1.6;
        }


        /* =========================
           PROPOSAL CARD
        ========================= */

        .proposal-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
        }


        /* =========================
           PROPOSAL HEADER
        ========================= */

        .proposal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .freelancer-name {
            margin: 0;
            color: #111827;
            font-size: 21px;
        }

        .submitted-date {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 13px;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-accepted {
            background: #dcfce7;
            color: #15803d;
        }

        .status-rejected {
            background: #fee2e2;
            color: #b91c1c;
        }

        .status-not-selected {
            background: #f1f5f9;
            color: #64748b;
        }


        /* =========================
           PROPOSAL DETAILS
        ========================= */

        .proposal-details {
            display: grid !important;
            grid-template-columns: 1fr 1fr !important;
            gap: 20px !important;
            margin-top: 24px !important;
            padding: 20px 0 !important;
            border-top: 1px solid #e5e7eb !important;
            border-bottom: 1px solid #e5e7eb !important;
        }

        .detail-item {
            display: block !important;
        }

        .detail-item span {
            display: block !important;
            margin-bottom: 6px !important;
            color: #94a3b8 !important;
            font-size: 13px !important;
        }

        .detail-item strong {
            display: block !important;
            color: #111827 !important;
            font-size: 17px !important;
        }


        /* =========================
           COVER LETTER
        ========================= */

        .cover-letter {
            margin-top: 22px;
        }

        .cover-letter h3 {
            margin: 0 0 10px;
            color: #111827;
            font-size: 16px;
        }

        .cover-letter p {
            margin: 0;
            color: #475569;
            line-height: 1.7;
        }


        /* =========================
           BUTTONS
        ========================= */

        .proposal-actions {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .accept-btn,
        .reject-btn {
            padding: 11px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .accept-btn {
            border: none;
            background: #16a34a;
            color: white;
        }

        .accept-btn:hover {
            background: #15803d;
        }

        .reject-btn {
            border: 1px solid #fecaca;
            background: white;
            color: #dc2626;
        }

        .reject-btn:hover {
            background: #fef2f2;
        }


        /* =========================
           NO PROPOSALS
        ========================= */

        .no-proposals {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 60px 25px;
            text-align: center;
        }

        .no-proposals-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .no-proposals h2 {
            margin: 0 0 8px;
            color: #111827;
        }

        .no-proposals p {
            margin: 0;
            color: #64748b;
        }


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        .success-message {
            display: none;
            margin-bottom: 25px;
            padding: 15px 20px;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            background: #f0fdf4;
            color: #166534;
            font-weight: 600;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .proposals-page {
                padding: 30px 16px 50px;
            }

            .page-header h1 {
                font-size: 28px;
            }

            .proposal-header {
                flex-direction: column;
            }

            .proposal-details {
                grid-template-columns: 1fr !important;
            }

            .proposal-actions {
                flex-direction: column;
            }

            .accept-btn,
            .reject-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <a
        href="index.html"
        class="logo">

        Freelance<span>Hub</span>

    </a>


    <ul class="nav-links">

        <li>
            <a href="client-dashboard.html">
                Dashboard
            </a>
        </li>

        <li>
            <a href="post-project.html">
                Post Project
            </a>
        </li>

        <li>
            <a href="projects.html">
                My Projects
            </a>
        </li>

        <li>
            <a href="profile.html">
                Profile
            </a>
        </li>

    </ul>


    <div class="nav-buttons">

        <a
            href="index.html"
            class="btn-login">

            Logout

        </a>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="proposals-page">

    <div class="proposals-container">


        <a
            href="projects.html"
            class="back-link">

            ← Back to My Projects

        </a>


        <div class="page-header">

            <h1>
                Freelancer Proposals
            </h1>

            <p>
                Review proposals submitted by
                freelancers for your project.
            </p>

        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            id="successMessage"
            class="success-message">

        </div>


        <!-- PROJECT -->

        <section
            id="projectSummary"
            class="project-summary">

            Loading project...

        </section>


        <!-- PROPOSALS -->

        <section
            id="proposalsContainer">

        </section>


    </div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div class="footer-bottom">

        © 2026 FreelanceHub. All rights reserved.

    </div>

</footer>


<script>


/* =====================================================
   LOAD PROJECT AND PROPOSALS
===================================================== */

function loadProposals() {


    const selectedProjectId =
        Number(
            localStorage.getItem(
                "selectedProject"
            )
        );


    const projects =
        JSON.parse(
            localStorage.getItem(
                "projects"
            )
        ) || [];


    const proposals =
        JSON.parse(
            localStorage.getItem(
                "proposals"
            )
        ) || [];


    const project =
        projects.find(
            function(project) {

                return project.id === selectedProjectId;

            }
        );


    const projectSummary =
        document.getElementById(
            "projectSummary"
        );


    const proposalsContainer =
        document.getElementById(
            "proposalsContainer"
        );


    /* PROJECT NOT FOUND */

    if (!project) {

        projectSummary.innerHTML = `

            <h2>
                Project Not Found
            </h2>

            <p>
                Please return to My Projects
                and select a project.
            </p>

        `;

        proposalsContainer.innerHTML = "";

        return;

    }


    /* PROJECT INFORMATION */

    projectSummary.innerHTML = `

        <span class="project-label">
            YOUR PROJECT
        </span>

        <h2>
            ${escapeHTML(project.title || "Untitled Project")}
        </h2>

        <p>
            ${escapeHTML(project.description || "No description available.")}
        </p>

    `;


    /* GET PROPOSALS FOR THIS PROJECT */

    const projectProposals =
        proposals.filter(
            function(proposal) {

                return proposal.projectId === selectedProjectId;

            }
        );


    /* NO PROPOSALS */

    if (projectProposals.length === 0) {

        proposalsContainer.innerHTML = `

            <div class="no-proposals">

                <div class="no-proposals-icon">
                    📩
                </div>

                <h2>
                    No Proposals Yet
                </h2>

                <p>
                    Freelancers have not submitted
                    any proposals for this project yet.
                </p>

            </div>

        `;

        return;

    }


    /* CLEAR OLD CONTENT */

    proposalsContainer.innerHTML = "";


    /* DISPLAY PROPOSALS */

    projectProposals.forEach(
        function(proposal) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "proposal-card";


            const statusClass =
                getStatusClass(
                    proposal.status
                );


            const freelancerName =
                proposal.freelancerName ||
                "Freelancer";


            card.innerHTML = `

                <div class="proposal-header">

                    <div>

                        <h2 class="freelancer-name">

                            👤
                            ${escapeHTML(freelancerName)}

                        </h2>

                        <div class="submitted-date">

                            Submitted:
                            ${escapeHTML(
                                proposal.submittedAt ||
                                "-"
                            )}

                        </div>

                    </div>


                    <span
                        class="status ${statusClass}">

                        ${escapeHTML(
                            proposal.status ||
                            "Pending"
                        )}

                    </span>

                </div>


                <div class="proposal-details">


                    <div class="detail-item">

                        <span>
                            Proposed Budget
                        </span>

                        <strong>

                            ₹${Number(
                                proposal.proposedBudget || 0
                            ).toLocaleString("en-IN")}

                        </strong>

                    </div>


                    <div class="detail-item">

                        <span>
                            Delivery Time
                        </span>

                        <strong>

                            ${proposal.deliveryTime || 0}
                            days

                        </strong>

                    </div>


                </div>


                <div class="cover-letter">

                    <h3>
                        Cover Letter
                    </h3>

                    <p>

                        ${escapeHTML(
                            proposal.coverLetter ||
                            "No cover letter provided."
                        )}

                    </p>

                </div>


                ${
                    proposal.status === "Pending"
                    ?

                    `

                    <div class="proposal-actions">

                        <button
                            class="accept-btn"
                            onclick="acceptProposal(${proposal.id})">

                            ✓ Accept Proposal

                        </button>


                        <button
                            class="reject-btn"
                            onclick="rejectProposal(${proposal.id})">

                            ✕ Reject

                        </button>

                    </div>

                    `

                    :

                    ""

                }

            `;


            proposalsContainer.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   ACCEPT PROPOSAL
===================================================== */

function acceptProposal(proposalId) {


    let proposals =
        JSON.parse(
            localStorage.getItem(
                "proposals"
            )
        ) || [];


    let projects =
        JSON.parse(
            localStorage.getItem(
                "projects"
            )
        ) || [];


    const selectedProjectId =
        Number(
            localStorage.getItem(
                "selectedProject"
            )
        );


    const selectedProposal =
        proposals.find(
            function(proposal) {

                return proposal.id === proposalId;

            }
        );


    if (!selectedProposal) {

        alert(
            "Proposal not found."
        );

        return;

    }


    /* ACCEPT SELECTED PROPOSAL */

    selectedProposal.status =
        "Accepted";


    /* MARK OTHER PENDING PROPOSALS
       AS NOT SELECTED */

    proposals.forEach(
        function(proposal) {

            if (
                proposal.projectId === selectedProjectId &&
                proposal.id !== proposalId &&
                proposal.status === "Pending"
            ) {

                proposal.status =
                    "Not Selected";

            }

        }
    );


    /* FIND PROJECT */

    const project =
        projects.find(
            function(project) {

                return project.id === selectedProjectId;

            }
        );


    /* UPDATE PROJECT */

    if (project) {

        project.status =
            "Assigned";

        project.assignedFreelancer =
            selectedProposal.freelancerName ||
            "Freelancer";

        project.assignedProposalId =
            selectedProposal.id;

    }


    /* SAVE PROPOSALS */

    localStorage.setItem(
        "proposals",
        JSON.stringify(
            proposals
        )
    );


    /* SAVE PROJECTS */

    localStorage.setItem(
        "projects",
        JSON.stringify(
            projects
        )
    );


    /* SHOW MESSAGE */

    const successMessage =
        document.getElementById(
            "successMessage"
        );


    successMessage.textContent =
        "✓ Proposal accepted successfully. The project has been assigned to the freelancer.";


    successMessage.style.display =
        "block";


    /* REFRESH */

    loadProposals();

}


/* =====================================================
   REJECT PROPOSAL
===================================================== */

function rejectProposal(proposalId) {


    let proposals =
        JSON.parse(
            localStorage.getItem(
                "proposals"
            )
        ) || [];


    const proposal =
        proposals.find(
            function(proposal) {

                return proposal.id === proposalId;

            }
        );


    if (!proposal) {

        alert(
            "Proposal not found."
        );

        return;

    }


    proposal.status =
        "Rejected";


    localStorage.setItem(
        "proposals",
        JSON.stringify(
            proposals
        )
    );


    /* SHOW MESSAGE */

    const successMessage =
        document.getElementById(
            "successMessage"
        );


    successMessage.textContent =
        "Proposal rejected.";


    successMessage.style.display =
        "block";


    loadProposals();

}


/* =====================================================
   STATUS CSS CLASS
===================================================== */

function getStatusClass(status) {


    if (status === "Accepted") {

        return "status-accepted";

    }


    if (status === "Rejected") {

        return "status-rejected";

    }


    if (status === "Not Selected") {

        return "status-not-selected";

    }


    return "status-pending";

}


/* =====================================================
   SECURITY HELPER
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(value);


    return div.innerHTML;

}


/* =====================================================
   START PAGE
===================================================== */

loadProposals();

</script>


</body>

</html>
