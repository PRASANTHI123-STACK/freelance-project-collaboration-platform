<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance Project Collaboration Platform</title>
</head>
<body>

    <h1>Freelance Project Collaboration Platform</h1>

    <h2>User Authentication</h2>

    <button>Client Registration</button>
    <button>Freelancer Registration</button>
    <button>User Login</button>

    <h2>Project Management</h2>

    <button>Post Project</button>
    <button>Browse Projects</button>
    <h2>Client Registration</h2>

<form>
    <label>Full Name:</label>
    <input type="text" name="name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="password" required>
    <br><br>

    <button type="submit">Register</button>
</form>
<h2>Freelancer Registration</h2>

<form>
    <label>Full Name:</label>
    <input type="text" name="freelancer-name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="freelancer-email" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="freelancer-password" required>
    <br><br>

    <label>Skills:</label>
    <input type="text" name="skills" required>
    <br><br>

    <button type="submit">Register as Freelancer</button>
</form>
<h2>User Login</h2>

<form>
    <label>Email:</label>
    <input type="email" name="login-email" required>
    <br><br>

    <label>Password:</label>
    <input type="password" name="login-password" required>
    <br><br>

    <button type="submit">Login</button>
</form>
<h2>Manage Profile</h2>

<form>
    <label>Full Name:</label>
    <input type="text" name="profile-name" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="profile-email" required>
    <br><br>

    <label>Phone:</label>
    <input type="tel" name="profile-phone" required>
    <br><br>

    <label>Skills:</label>
    <input type="text" name="profile-skills">
    <br><br>

    <label>Bio:</label>
    <textarea name="profile-bio"></textarea>
    <br><br>

    <button type="submit">Update Profile</button>
</form>
<h2>Post Project</h2>

<form>
    <label>Project Title:</label>
    <input type="text" name="project-title" required>
    <br><br>

    <label>Project Description:</label>
    <textarea name="project-description" required></textarea>
    <br><br>

    <label>Budget:</label>
    <input type="number" name="budget" required>
    <br><br>

    <label>Deadline:</label>
    <input type="date" name="deadline" required>
    <br><br>

    <button type="submit">Post Project</button>
</form>


</body>
</html>
